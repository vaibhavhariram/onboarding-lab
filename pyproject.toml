[project]
name = "onboarding-lab"
version = "0.1.0"
description = "Synthetic evaluation harness for conversational intake / voice onboarding pipelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "jsonschema>=4.21",
]

[project.scripts]
lab = "onboarding_lab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # typer uses function calls (Option/Argument) in defaults by design
    "RUF012",  # pydantic model fields are not ClassVar
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::UserWarning"]
